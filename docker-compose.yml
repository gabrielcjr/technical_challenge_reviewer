services:
  database:
    image: postgres:17-alpine
    container_name: challenge_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.docker/db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  django:
    build:
      context: ./django-backend
      dockerfile: Dockerfile
    container_name: challenge_django
    restart: unless-stopped
    command: ["sh", "-c", "python manage.py migrate --fake-initial --noinput && python manage.py runserver 0.0.0.0:8000 --insecure"]
    ports:
      - "${DJANGO_PORT:-8002}:8000"
    volumes:
      - ./django-backend:/app
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN}
      PYTHON_EVALUATOR_URL: http://python-evaluator:8000
      DJANGO_CALLBACK_URL: http://nginx/api/internal/evaluation-result
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: challenge_nginx
    restart: unless-stopped
    ports:
      - "${SYMFONY_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django
    networks:
      - app-network

  python-evaluator:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: challenge_python
    restart: unless-stopped
    ports:
      - "${EVALUATOR_PORT:-8001}:8000"
    volumes:
      - ./python-service/app:/app/app
    env_file:
      - path: .env
        required: false
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      DJANGO_CALLBACK_URL: ${DJANGO_CALLBACK_URL:-http://nginx/api/internal/evaluation-result}
      SYMFONY_CALLBACK_URL: ${SYMFONY_CALLBACK_URL:-http://nginx/api/internal/evaluation-result}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN}
      PYTHONUNBUFFERED: 1
    depends_on:
      - nginx
    networks:
      - app-network

  django-worker:
    build:
      context: ./django-backend
      dockerfile: Dockerfile
    container_name: challenge_worker
    restart: unless-stopped
    volumes:
      - ./django-backend:/app
    depends_on:
      database:
        condition: service_healthy
      django:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN}
      PYTHON_EVALUATOR_URL: http://python-evaluator:8000
      DJANGO_CALLBACK_URL: http://nginx/api/internal/evaluation-result
    command: ["sh", "-c", "python manage.py run_worker"]
    networks:
      - app-network

  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    container_name: challenge_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./react-frontend:/app
      - /app/node_modules
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
