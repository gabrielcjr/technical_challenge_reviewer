name: CI

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

# Cancel previous runs if new commit pushed to same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build containers & run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare .env file
        run: |
          cp .env.example .env || true
          cat > .env <<'EOF'
          POSTGRES_DB=challenge_reviewer
          POSTGRES_USER=app
          POSTGRES_PASSWORD=app
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql://app:app@database:5432/challenge_reviewer
          DJANGO_SECRET_KEY=test_random_secret_for_ci_32_chars_long
          SYMFONY_PORT=8080
          PYTHON_EVALUATOR_URL=http://python-evaluator:8000
          DJANGO_CALLBACK_URL=http://nginx/api/internal/evaluation-result
          CALLBACK_TOKEN=s3cr3t_shared_token_change_me
          EVALUATOR_PORT=8001
          GROQ_API_KEY=dummy_key_for_ci
          GEMINI_API_KEY=dummy_key_for_ci
          LLM_PROVIDER=auto
          EOF
          cat .env

      - name: Build Docker images
        run: docker compose build --no-cache

      - name: Start database and wait for healthy
        run: |
          docker compose up -d database
          echo "Waiting for postgres to be healthy..."
          timeout 60 bash -c 'until docker inspect --format="{{.State.Health.Status}}" challenge_db | grep -q "healthy"; do sleep 2; echo "waiting..."; done'
          docker compose ps
          docker compose logs database

      - name: Start all services
        run: |
          docker compose up -d django nginx python-evaluator django-worker frontend
          docker compose ps
          # Give services a moment to initialize
          sleep 10

      - name: Run Django migrations
        run: |
          docker compose exec -T django python manage.py migrate --noinput

      - name: Run Django tests
        run: |
          docker compose exec -T django python manage.py test

      - name: Run Python evaluator tests
        run: |
          docker compose exec -T python-evaluator pytest -v --color=yes
          docker compose exec -T python-evaluator python -m py_compile app/*.py || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install React dependencies
        working-directory: ./react-frontend
        run: |
          sudo chown -R $USER:$USER .
          npm install

      - name: Run React Unit tests
        working-directory: ./react-frontend
        run: npm run test -- --run

      - name: Install Playwright Browsers
        working-directory: ./react-frontend
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        working-directory: ./react-frontend
        run: npm run test:e2e

      - name: Verify services health
        if: always()
        run: |
          echo "=== docker compose ps ==="
          docker compose ps -a
          echo "=== Django health ==="
          docker compose exec -T django python manage.py check || true
          echo "=== Python health check ==="
          curl -sf http://localhost:8001/health || docker compose exec -T python-evaluator curl -sf http://localhost:8000/health || echo "health endpoint not reachable via localhost, checking inside network"
          docker compose exec -T python-evaluator python -c "import app.main; print('FastAPI app import OK')" || true

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== database logs ==="
          docker compose logs --tail=200 database || true
          echo "=== django logs ==="
          docker compose logs --tail=200 django || true
          echo "=== nginx logs ==="
          docker compose logs --tail=200 nginx || true
          echo "=== python-evaluator logs ==="
          docker compose logs --tail=200 python-evaluator || true
          echo "=== django-worker logs ==="
          docker compose logs --tail=200 django-worker || true

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          docker system prune -f || true
